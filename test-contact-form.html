<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Contact form test</title></head>
<body style="font-family:sans-serif;max-width:400px;margin:40px auto">
<h3>Test /api/contact</h3>
<form id="contact-form" style="display:flex;flex-direction:column;gap:10px">
  <input type="text" name="name" placeholder="Your name" required />
  <input type="email" name="email" placeholder="Your email" required />
  <textarea name="message" placeholder="Your message" required></textarea>
  <button type="submit">Send</button>
</form>

<script>
  document.getElementById("contact-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const data = Object.fromEntries(new FormData(form));

    const res = await fetch("/api/contact", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });

    if (res.ok) {
      alert("Message sent!");
      form.reset();
    } else {
      alert("Something went wrong. Please try again. Status: " + res.status);
    }
  });
</script>
</body>
</html>
